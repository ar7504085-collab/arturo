```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REY GAMER PRO</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial, Helvetica, sans-serif;
      position:relative;
      perspective:2000px;

      /* IMAGEN DE FONDO */
      background:
      linear-gradient(rgba(10,0,20,0.7), rgba(10,0,20,0.9)),
      url('mujeres.png');

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    /* EFECTO OSCURO */

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at center,
      rgba(180,0,255,0.15),
      rgba(0,0,0,0.8));
      z-index:1;
    }

    /* PARTICULAS */

    .particles{
      position:absolute;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:2;
    }

    .particle{
      position:absolute;
      width:6px;
      height:6px;
      border-radius:50%;
      background:#d946ef;
      box-shadow:
      0 0 10px #ff00ff,
      0 0 20px #ff00ff,
      0 0 40px #ff00ff;
      animation:float linear infinite;
    }

    @keyframes float{
      from{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
      }

      50%{
        opacity:1;
      }

      to{
        transform:translateY(-120vh) scale(1.2);
        opacity:0;
      }
    }

    /* CONTENEDOR 3D */

    .container{
      position:relative;
      z-index:10;
      transform-style:preserve-3d;
      animation:rotate3d 6s ease-in-out infinite alternate;
    }

    @keyframes rotate3d{
      from{
        transform:rotateY(-8deg) rotateX(3deg);
      }

      to{
        transform:rotateY(8deg) rotateX(-3deg);
      }
    }

    /* TEXTO 3D */

    h1{
      position:relative;
      text-align:center;
      font-size:120px;
      line-height:0.9;
      text-transform:uppercase;
      letter-spacing:6px;
      font-weight:900;

      background:linear-gradient(
      180deg,
      #ffffff 0%,
      #f0abfc 30%,
      #c026d3 60%,
      #6b21a8 100%);

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      filter:drop-shadow(0 0 10px #ff00ff)
      drop-shadow(0 0 30px #d946ef)
      drop-shadow(0 0 60px #7e22ce);

      transform:translateZ(100px);

      animation:pulse 2s infinite alternate;
    }

    /* EFECTO 3D EXTRA */

    h1::before{
      content:"REY GAMER PRO";
      position:absolute;
      inset:0;
      color:rgba(255,255,255,0.08);
      transform:translateZ(-50px) translateX(12px) translateY(12px);
      filter:blur(8px);
      z-index:-1;
    }

    h1::after{
      content:"👑";
      position:absolute;
      top:-90px;
      left:50%;
      transform:translateX(-50%);
      font-size:90px;
      filter:drop-shadow(0 0 15px #ff00ff)
      drop-shadow(0 0 40px #ff00ff);
      animation:crownFloat 2s ease-in-out infinite;
    }

    @keyframes pulse{
      from{
        transform:translateZ(100px) scale(1);
      }

      to{
        transform:translateZ(150px) scale(1.05);
      }
    }

    @keyframes crownFloat{
      0%{
        transform:translateX(-50%) translateY(0px);
      }

      100%{
        transform:translateX(-50%) translateY(-10px);
      }
    }

    /* TRUENOS */

    .lightning{
      position:absolute;
      width:8px;
      height:260px;
      background:white;
      opacity:0;
      z-index:3;
      filter:blur(1px);

      box-shadow:
      0 0 20px white,
      0 0 40px #ff00ff,
      0 0 80px #ff00ff,
      0 0 140px #c026d3;
    }

    .flash{
      position:absolute;
      inset:0;
      background:white;
      opacity:0;
      z-index:2;
      pointer-events:none;
    }

    /* RESPONSIVE */

    @media(max-width:900px){

      h1{
        font-size:70px;
      }

      h1::after{
        font-size:60px;
        top:-70px;
      }
    }

  </style>
</head>

<body>

  <div class="flash"></div>

  <div class="particles"></div>

  <div class="container">
    <h1>
      REY<br>
      GAMER PRO
    </h1>
  </div>

  <script>

    /* PARTICULAS */

    const particlesContainer =
    document.querySelector('.particles');

    function createParticle(){

      const particle =
      document.createElement('div');

      particle.classList.add('particle');

      particle.style.left =
      Math.random()*100 + 'vw';

      particle.style.animationDuration =
      (3 + Math.random()*6) + 's';

      particle.style.opacity =
      Math.random();

      particle.style.transform =
      `scale(${Math.random()*1.5})`;

      particlesContainer.appendChild(particle);

      setTimeout(()=>{
        particle.remove();
      },9000);
    }

    setInterval(createParticle,80);

    /* TRUENOS */

    const flash = document.querySelector('.flash');

    function createLightning(){

      const lightning =
      document.createElement('div');

      lightning.classList.add('lightning');

      lightning.style.left =
      Math.random()*100 + 'vw';

      lightning.style.top =
      Math.random()*40 + 'vh';

      lightning.style.transform =
      `rotate(${Math.random()*30-15}deg)`;

      document.body.appendChild(lightning);

      lightning.animate([
        { opacity:0 },
        { opacity:1 },
        { opacity:0.2 },
        { opacity:1 },
        { opacity:0 }
      ],{
        duration:400,
        easing:'ease-out'
      });

      flash.animate([
        { opacity:0 },
        { opacity:0.25 },
        { opacity:0 }
      ],{
        duration:300
      });

      setTimeout(()=>{
        lightning.remove();
      },500);
    }

    setInterval(createLightning,1800);

  </script>

</body>
</html>
```

Usa la imagen `mujeres.png` en la misma carpeta del `index.html` para que cargue automáticamente el fondo en 3D.
