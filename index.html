<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REY</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #12001f, #3b0066, #8a2be2);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    h1 {
      font-size: 90px;
      letter-spacing: 8px;
      text-shadow: 0 0 15px #fff, 0 0 35px #ff00ff, 0 0 60px #a855f7;
      z-index: 10;
      animation: brillo 2s infinite alternate;
    }

    @keyframes brillo {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .balloon {
      position: absolute;
      top: -120px;
      width: 55px;
      height: 70px;
      border-radius: 50%;
      animation: caer linear infinite;
      box-shadow: inset -8px -10px rgba(0,0,0,0.2);
    }

    .balloon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -45px;
      width: 2px;
      height: 45px;
      background: rgba(255,255,255,0.7);
    }

    .balloon::before {
      content: "";
      position: absolute;
      left: 22px;
      bottom: -8px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 10px solid rgba(255,255,255,0.8);
    }

    @keyframes caer {
      0% {
        transform: translateY(-120px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>

  <h1>REY</h1>

  <script>
    const colors = [
      "#ff0055",
      "#ffcc00",
      "#00e5ff",
      "#9d4edd",
      "#00ff99",
      "#ff7b00",
      "#ffffff"
    ];

    function createBalloon() {
      const balloon = document.createElement("div");
      balloon.classList.add("balloon");

      balloon.style.left = Math.random() * 100 + "vw";
      balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
      balloon.style.animationDuration = (4 + Math.random() * 5) + "s";
      balloon.style.opacity = 0.7 + Math.random() * 0.3;
      balloon.style.transform = `scale(${0.7 + Math.random() * 0.8})`;

      document.body.appendChild(balloon);

      setTimeout(() => {
        balloon.remove();
      }, 9000);
    }

    setInterval(createBalloon, 250);
  </script>

</body>
</html>
